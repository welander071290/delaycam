<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#26302a"/>
      <stop offset="1" stop-color="#0c100e"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f47a"/>
      <stop offset="1" stop-color="#c9da4a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Viewfinder / lens hood -->
  <path d="M352 222 L438 174 Q452 166 452 182 L452 330 Q452 346 438 338 L352 290 Z"
        fill="url(#body)" stroke="url(#body)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Camera body -->
  <rect x="62" y="146" width="300" height="220" rx="48" fill="url(#body)"/>

  <!-- Record light -->
  <circle cx="320" cy="184" r="13" fill="#e2552c"/>

  <!-- Clock lens -->
  <circle cx="206" cy="256" r="94" fill="#1f2320"/>
  <circle cx="206" cy="256" r="81" fill="#0c100e"/>

  <!-- Delay sector: 12 to 3 o'clock -->
  <path d="M206 256 L206 184 A72 72 0 0 1 278 256 Z" fill="#e2552c" opacity="0.9"/>

  <!-- Ticks -->
  <g stroke="#daea5d" stroke-width="7" stroke-linecap="round">
    <line x1="206" y1="190" x2="206" y2="202"/>
    <line x1="272" y1="256" x2="260" y2="256"/>
    <line x1="206" y1="322" x2="206" y2="310"/>
    <line x1="140" y1="256" x2="152" y2="256"/>
  </g>

  <!-- Hands, pointing back in time -->
  <g stroke="#f8f6ef" stroke-linecap="round">
    <line x1="206" y1="256" x2="206" y2="200" stroke-width="12"/>
    <line x1="206" y1="256" x2="248" y2="256" stroke-width="12"/>
  </g>
  <circle cx="206" cy="256" r="11" fill="#f8f6ef"/>
</svg>
